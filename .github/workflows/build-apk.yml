name: Gerar APK DRIP WIRE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          mkdir project
          unzip DRIP_WIRE_GITHUB_READY_v2.zip -d project

      - name: Compilar APK
        run: gradle -p project assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: drip-wire-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
